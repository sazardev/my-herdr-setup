onboarding = false
# herdr configuration — sazardev
# Destino: ~/.config/herdr/config.toml (Linux/macOS/WSL, ruta XDG)
#
# Referencia completa de opciones y sus valores por defecto:
#   herdr --default-config
#
# Solo se listan aquí las opciones que se cambiaron respecto al default.
# Cualquier otra opción usa el comportamiento estándar de herdr.

[theme]
# "terminal" = la UI de herdr hereda la paleta ANSI del terminal host
# (Alacritty): los colores salen del tema de Alacritty, no de uno propio de
# herdr. Se re-lee al redimensionar/SIGWINCH. Para volver al anterior:
# name = "gruvbox". Otros built-in: catppuccin, tokyo-night, dracula, nord,
#                        one-dark, solarized, kanagawa, rose-pine, vesper
name = "terminal"

# No seguir automáticamente el modo claro/oscuro del terminal host:
# el tema se elige manualmente arriba y se queda fijo entre sistemas.
auto_switch = false

[theme.custom]
# "reset" = usa el fondo por defecto del terminal en vez de pintar uno propio:
# herdr queda "transparente" y se ve exactamente el fondo de Alacritty.
panel_bg = "reset"

[ui]
# Agrupa el panel de agentes por space/workspace (proyecto). La alternativa
# "priority" los ordena por quién necesita respuesta primero.
agent_panel_sort = "spaces"

# Sin espacio extra entre panes: comparten el borde divisor en vez de tener
# un gap visual. Máximo aprovechamiento de pantalla en splits.
pane_gaps = false

# Línea de borde alrededor de los panes: con pane_gaps en false, esta línea
# queda como único divisor visible entre paneles (sin gap extra).
pane_borders = true

# Oculta la fila de tabs cuando el workspace tiene un solo tab — menos
# ruido visual cuando no hace falta elegir entre varios. Los tabs nuevos
# se pueden seguir creando con el keybinding configurado (prefix+c).
hide_tab_bar_when_single_tab = true

show_agent_labels_on_pane_borders = true

# Símbolos distintos por estado (bloqueado/trabajando/terminado/inactivo) en
# vez de solo color: se distinguen de un vistazo sin depender del tema.
status_indicators = "symbols"

# Sidebar de ancho fijo: no "respira" al cambiar de proyecto/workspace.
sidebar_width = 34
sidebar_min_width = 34
sidebar_max_width = 34

# Título de la ventana del terminal host (barra de Windows / Alacritty).
# Vacío = herdr no lo toca: lo escribe claude/herdr-statusline.sh con las
# barras de los límites 5h / 7d del plan (una sola vez, en vez de repetirlas
# en cada agente). Para volver al título por workspace: "{hostname}: {workspace}".
window_title = ""

[ui.toast]
# Toast dentro de herdr cuando un agente en segundo plano termina o se
# bloquea esperando respuesta. Otros valores: "off", "terminal" (notificación
# del terminal host), "system" (servicio de notificaciones del SO).
delivery = "herdr"

# Solo avisa si el agente sigue en ese estado tras 1 s: filtra parpadeos
# working<->idle y evita fatiga de alertas.
delay_seconds = 1

[ui.sound]
# Sonido cuando un agente cambia de estado en un workspace en segundo plano.
# Requiere audio en WSL: usa el PulseServer de WSLg (/mnt/wslg/PulseServer).
enabled = true

[ui.sidebar.agents]
# Fila 1 = default de herdr. Se quitó la fila ["agent"] (nombre del agente:
# claude/opencode…) por no aportar. terminal_title_stripped muestra en qué
# está trabajando el agente ahora. $cost viene del hook "Stop" de Claude Code
# (claude/hooks/herdr-usage-metadata.sh): gasto estimado en USD de la sesión
# de ese pane a precios de API pública; solo sube, no fluctúa. El hook también
# reporta $tok (tokens totales) y $cachep (% de escrituras de caché), pero no
# se muestran: no responden "cuánto llevo gastado". $cost lleva "api" porque
# con plan Max es un equivalente a precios de API, no un cobro.
# Los límites 5 h / semanal del plan (de toda la cuenta) NO van aquí: serían
# idénticos en cada agente. Se muestran en el título de la ventana (ver
# window_title más arriba).
rows = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["$cost"]]

[keys]
# prefix+shift+1..9 cambia de workspace directo por índice, sin pasar por
# el workspace picker (prefix+w).
switch_workspace = "prefix+shift+1..9"

# Foco entre panes: sin overrides a propósito. El default de herdr ya es
# prefix (ctrl+b) + h/j/k/l, y en modo navegación las flechas izq/der también
# mueven el foco. Antes se reasignaba focus_pane_* a las flechas y se
# re-bindeaba hjkl como comandos shell; en navigate mode las flechas
# arriba/abajo cambian de workspace (no de pane) y eso chocaba con el override.
